name: Domain expiry check

on:
  schedule:
    - cron: "0 1 * * *" # every day 08:00 Thailand time
  workflow_dispatch:

permissions:
  issues: write
  actions: write

env:
  DOMAIN: sorawich.in.th
  WARN_DAYS: 45 # open an issue when this many days or fewer are left
  NOTIFY_DAYS: "45 30 14 7 3 2 1 0" # days on which to send another email

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HAS_LINE: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN != '' && secrets.LINE_USER_ID != '' }}
    steps:
      - name: Look up expiry date (THNIC WHOIS)
        id: whois
        shell: python
        run: |
          import os, socket
          from datetime import datetime, timezone
          s = socket.create_connection(("whois.thnic.co.th", 43), timeout=30)
          s.sendall(f"{os.environ['DOMAIN']}\r\n".encode())
          data = b""
          while chunk := s.recv(4096):
              data += chunk
          line = next(l for l in data.decode("utf-8", "replace").splitlines() if l.startswith("Exp date:"))
          exp = datetime.strptime(line.split(":", 1)[1].strip(), "%d %b %Y").replace(tzinfo=timezone.utc)
          days = (exp - datetime.now(timezone.utc)).days
          print(f"{os.environ['DOMAIN']} expires {exp:%Y-%m-%d} ({days} days left)")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"expires={exp:%d %b %Y}\ndays={days}\n")

      - name: Open, update or close the reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPIRES: ${{ steps.whois.outputs.expires }}
          DAYS: ${{ steps.whois.outputs.days }}
        run: |
          TITLE="⚠️ Renew domain $DOMAIN"
          ISSUE=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ "$DAYS" -gt "$WARN_DAYS" ]; then
            if [ -n "$ISSUE" ]; then
              gh issue close "$ISSUE" --comment "✅ Renewed — $DOMAIN now expires on $EXPIRES ($DAYS days left)."
            fi
            echo "OK: $DAYS days left"
            exit 0
          fi
          MSG="โดเมน **$DOMAIN** จะหมดอายุวันที่ **$EXPIRES** (เหลือ **$DAYS วัน**)

          ต่ออายุที่ที่ซื้อโดเมนมา (THNIC หรือตัวแทนจดโดเมน) — Cloudflare ต่อ .in.th ไม่ได้
          ต่อแล้ว issue นี้จะปิดเองอัตโนมัติภายใน 1 วัน"
          if [ -z "$ISSUE" ]; then
            gh issue create --title "$TITLE" --body "$MSG" --assignee "${{ github.repository_owner }}"
          elif echo " $NOTIFY_DAYS " | grep -q " $DAYS "; then
            gh issue comment "$ISSUE" --body "$MSG"
          else
            echo "Issue #$ISSUE already open; next email on one of: $NOTIFY_DAYS days left"
            exit 0
          fi
          echo "notify=true" >> "$GITHUB_OUTPUT"
        id: issue

      - name: Send LINE message
        # sent on reminder days, and on every manual run (to test the LINE setup)
        if: env.HAS_LINE == 'true' && (steps.issue.outputs.notify == 'true' || github.event_name == 'workflow_dispatch')
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_USER_ID }}
          EXPIRES: ${{ steps.whois.outputs.expires }}
          DAYS: ${{ steps.whois.outputs.days }}
        run: |
          TEXT="⚠️ โดเมน $DOMAIN จะหมดอายุวันที่ $EXPIRES (เหลือ $DAYS วัน)
          ต่ออายุที่ THNIC หรือตัวแทนจดโดเมนที่ซื้อมา
          ${{ github.server_url }}/${{ github.repository }}/issues"
          jq -n --arg to "$LINE_TO" --arg text "$TEXT" '{to: $to, messages: [{type: "text", text: $text}]}' \
            | curl -sS --fail-with-body -X POST https://api.line.me/v2/bot/message/push \
                -H "Authorization: Bearer $LINE_TOKEN" -H "Content-Type: application/json" -d @-

      - name: Keep this scheduled workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/domain-expiry.yml/enable"
