# Sveltia CMS — https://sveltiacms.app
# Sign in with "Sign In with Token" using a fine-grained GitHub token that has
# Contents: Read and write on bankkk1996/personal-website. Saving commits to main,
# and the CI/CD workflow rebuilds and deploys the site (about a minute).
backend:
  name: github
  repo: bankkk1996/personal-website
  branch: main
  commit_messages:
    update: "Update site content via CMS"

site_url: https://sorawich.in.th
display_url: https://sorawich.in.th
locale: en

media_folder: public/uploads
public_folder: /uploads
media_libraries:
  default:
    config:
      max_file_size: 10000000 # 10 MB before conversion
      transformations:
        raster_image: # uploads are resized and converted to WebP
          format: webp
          quality: 85
          width: 800
          height: 800

collections:
  - name: site
    label: Website
    files:
      - name: content
        label: Site content
        file: src/content/site.json
        format: json
        fields:
          - name: availability
            label: Open to new opportunities
            widget: object
            collapsed: false
            fields:
              - { name: open, label: "Show the \"open to opportunities\" badge", widget: boolean, default: true }
              - { name: label, label: Badge text, widget: string, default: Open to new opportunities }
              - name: types
                label: "Interested in (shown under Contact, e.g. Full-time, Freelance, Remote)"
                widget: list
                required: false
                field: { name: type, label: Type, widget: string }
          - name: hero
            label: Hero (top of page)
            widget: object
            fields:
              - { name: greeting, label: Greeting, widget: string }
              - { name: name, label: Name, widget: string }
              - { name: tagline, label: Tagline, widget: string }
              - { name: intro, label: Intro, widget: text }
              - { name: github, label: GitHub URL, widget: string }
              - { name: photo, label: "Profile photo (square works best; replace the placeholder)", widget: image, required: false }
          - name: about
            label: About
            widget: object
            fields:
              - { name: text, label: About text, widget: text }
              - { name: skills, label: Skills, widget: list, field: { name: skill, label: Skill, widget: string } }
          - name: experience
            label: Experience
            label_singular: Job
            widget: list
            required: false
            hint: Newest first. Leave "End" empty for your current job. The section is hidden while the list is empty.
            summary: "{{fields.role}} · {{fields.company}} ({{fields.start}} – {{fields.end}})"
            fields:
              - { name: role, label: Role / position, widget: string }
              - { name: company, label: Company, widget: string }
              - { name: location, label: Location, widget: string, required: false }
              - { name: start, label: "Start (e.g. 2023 or Jan 2023)", widget: string }
              - { name: end, label: "End (empty = Present)", widget: string, required: false }
              - { name: description, label: What you did, widget: text, required: false }
          - name: projects
            label: Projects
            label_singular: Project
            widget: list
            summary: "{{fields.title}} ({{fields.year}})"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: year, label: Year, widget: number, value_type: int }
              - { name: description, label: Description, widget: text }
              - { name: tags, label: Tags, widget: list, field: { name: tag, label: Tag, widget: string } }
              - name: links
                label: Links
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: url, label: URL, widget: string }
              - { name: private, label: "Private project (no links shown)", widget: boolean, default: false, required: false }
          - name: contact
            label: Contact
            widget: object
            fields:
              - { name: text, label: Text, widget: text }
              - { name: email, label: "Email (shown as a mailto button; empty = hidden)", widget: string, required: false }
              - { name: linkedin, label: "LinkedIn URL (https://www.linkedin.com/in/…; empty = hidden)", widget: string, required: false }
              - { name: cv, label: "CV (PDF) — shown as Download CV in the hero and here; empty = hidden", widget: file, required: false }
              - name: links
                label: Other buttons
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: url, label: "URL (https://… or mailto:…)", widget: string }
